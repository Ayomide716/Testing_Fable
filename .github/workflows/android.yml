name: Build Android APK

# Builds an installable APK on Expo's servers and attaches it to a release,
# so nobody has to run npm or eas locally.
#
# One-time setup:
#   1. Create a free account at https://expo.dev
#   2. Expo dashboard → account settings → Access tokens → Create token
#   3. GitHub → Settings → Secrets and variables → Actions → New repository
#      secret named EXPO_TOKEN, pasted from step 2
#
# Then: Actions → Build Android APK → Run workflow. The build takes roughly
# 10-20 minutes on Expo's free queue. The APK is attached to the release you
# name, and the download page picks up any .apk asset automatically.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach the APK to, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'
      expo_account:
        description: 'Expo account that owns the EAS project'
        required: true
        default: 'ayfrosh2008'

permissions:
  contents: write

jobs:
  android:
    name: EAS build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: current eas-cli pulls @oclif/plugin-autocomplete,
          # which declares engines.node >= 22 and fails the install outright.
          node-version: '22'

      - name: Check the Expo token is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is not set. See the comment at the top of this workflow."
            exit 1
          fi

      - name: Install dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      # Catches SDK/native version drift in seconds, instead of after a
      # fourteen-minute build or — worse — in a crash on the user's phone.
      # This is what would have caught react-native-reanimated resolving to
      # v4 on an SDK 53 (RN 0.79) project.
      - name: Check dependency versions against the Expo SDK
        working-directory: mobile
        run: npx expo install --check

      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run the crypto tests
        working-directory: mobile
        run: npx jest --ci
        continue-on-error: false

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # The project is registered as @ayfrosh2008/clipsync and its id lives in
      # app.json under extra.eas.projectId, so builds link to it directly. If
      # that id is ever missing, run once:
      #   eas init --account <account> --non-interactive
      - name: Confirm the EAS project is linked
        working-directory: mobile
        run: |
          node -e "
            const id = require('./app.json').expo?.extra?.eas?.projectId;
            if (!id) {
              console.error('app.json has no extra.eas.projectId — see the note above this step');
              process.exit(1);
            }
            console.log('building against EAS project', id);
          "

      # --wait blocks until Expo finishes. --output is rejected for cloud
      # builds ("--output is allowed only for local builds"), so the APK is
      # fetched from the artifact URL the build reports instead.
      - name: Build the APK on EAS
        working-directory: mobile
        run: |
          set -o pipefail
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json | tee build.json

          url=$(node -e "
            const data = JSON.parse(require('fs').readFileSync('build.json', 'utf8'));
            const build = Array.isArray(data) ? data[0] : data;
            const art = build.artifacts || {};
            const url = art.applicationArchiveUrl || art.buildUrl;
            if (!url) {
              console.error('build finished but reported no artifact url');
              console.error(JSON.stringify(build, null, 2));
              process.exit(1);
            }
            process.stdout.write(url);
          ")

          echo "Downloading $url"
          curl -fL --retry 3 "$url" -o ../clipsync-android.apk
          ls -lh ../clipsync-android.apk

      # Uploaded through the REST API rather than action-gh-release: with an
      # asset of this name already present the action takes an update path
      # keyed on github.ref, which on a manual run is a branch and not a tag,
      # and fails with "Resource not accessible by integration". Deleting the
      # old asset and posting the new one needs only contents: write.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN"
                -H "Accept: application/vnd.github+json")

          release_id=$(curl -fsSL "${auth[@]}" "$api/releases/tags/$TAG" \
            | node -e "process.stdin.on('data',d=>{const r=JSON.parse(d);process.stdout.write(String(r.id))})")
          echo "release $TAG has id $release_id"

          # Replace any previous APK so the download page keeps one clear link.
          old=$(curl -fsSL "${auth[@]}" "$api/releases/$release_id/assets" \
            | node -e "
              let raw='';
              process.stdin.on('data', d => raw += d);
              process.stdin.on('end', () => {
                const hit = JSON.parse(raw).find(a => a.name === 'clipsync-android.apk');
                process.stdout.write(hit ? String(hit.id) : '');
              });
            ")
          if [ -n "$old" ]; then
            echo "deleting previous asset $old"
            curl -fsSL -X DELETE "${auth[@]}" "$api/releases/assets/$old"
          fi

          echo "uploading $(du -h clipsync-android.apk | cut -f1)"
          curl -fsSL -X POST "${auth[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @clipsync-android.apk \
            "https://uploads.github.com/repos/$REPO/releases/$release_id/assets?name=clipsync-android.apk" \
            -o /dev/null
          echo "uploaded clipsync-android.apk to $TAG"
